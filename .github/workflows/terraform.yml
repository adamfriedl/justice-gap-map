# Terraform for infra/main: plan on pull requests; apply when a merge lands on
# main. "Run workflow" in the Actions tab re-runs apply on main by hand.
# Without required reviewers (paid plan), merging is the approval: read the
# PR's plan before merging.
# infra/bootstrap is applied by hand (docs/aws-setup.md) and is only format-
# and validity-checked here.
name: terraform

on:
  # src/ and the Harris fetch script are the Lambda function's code, which
  # Terraform zips and deploys (infra/main/jobs.tf), so a change to them needs
  # a plan and an apply too.
  pull_request:
    paths: ["infra/**", "src/**", "scripts/lawsuits_fetch_harris.py", ".github/workflows/terraform.yml"]
  push:
    branches: [main]
    paths: ["infra/**", "src/**", "scripts/lawsuits_fetch_harris.py", ".github/workflows/terraform.yml"]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "1"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.7
      - run: terraform fmt -check -recursive infra
      - run: terraform -chdir=infra/bootstrap init -backend=false -input=false && terraform -chdir=infra/bootstrap validate
      - run: terraform -chdir=infra/main init -backend=false -input=false && terraform -chdir=infra/main validate

  plan:
    if: github.event_name == 'pull_request' && vars.AWS_PLAN_ROLE_ARN != ''
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # lets the job request a GitHub OIDC token for AWS
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.7
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: us-east-2
      - run: terraform -chdir=infra/main init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
      - run: terraform -chdir=infra/main plan -input=false -no-color

  apply:
    # Merges to main (or a manual re-run on main). The "production" environment
    # is limited to the main branch, and the apply role trusts only jobs in it.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.AWS_APPLY_ROLE_ARN != ''
    needs: check
    runs-on: ubuntu-latest
    environment: production   # the apply role's trust policy requires this environment
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.7
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: us-east-2
      - run: terraform -chdir=infra/main init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
      - run: terraform -chdir=infra/main apply -input=false -auto-approve -no-color
